name: CI Checks

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-python:
    name: CI — Lint & Check / Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install paho-mqtt flake8
          
      - name: Check for Syntax Errors
        run: |
          # ตรวจสอบ Syntax Error ในโฟลเดอร์ Final_IoT_Project
          flake8 Final_IoT_Project/ --count --select=E9,F63,F7,F82 --show-source --statistics

  frontend-react:
    name: CI — Build & Lint / Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          
      - name: Install Dependencies
        working-directory: ./iot-dashboard
        # ใช้ npm install เพื่อลงแพ็กเกจ
        run: npm install
        
      - name: Type Check & Lint
        working-directory: ./iot-dashboard
        run: npm run lint
        
      - name: Build Check
        working-directory: ./iot-dashboard
        # ลอง Build โค้ดดูว่ามี Error หรือไม่
        run: npm run build
