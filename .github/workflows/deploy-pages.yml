name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: ["main", "master"]
    # ทำงานอัตโนมัติเมื่อมีการแก้โค้ดหน้าเว็บ
    paths:
      - 'iot-dashboard/**'
  workflow_dispatch: # เผื่อกดรันเองแบบ Manual ได้

# อนุญาตให้ GitHub นำไฟล์ไปสร้างหน้าเว็บได้
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Dependencies
        working-directory: ./iot-dashboard
        run: npm install
        
      - name: Build Web Application
        working-directory: ./iot-dashboard
        run: npm run build
        
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4
        
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # โฟลเดอร์ที่ Vite สร้างไฟล์เสร็จแล้ว
          path: './iot-dashboard/dist'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
